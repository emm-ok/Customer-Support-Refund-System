services:
  postgres:
    image: postgres:16-alpine
    container_name: refund_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - refund_network


  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: refund_backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000

      DATABASE_URL: ${DATABASE_URL}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}

    ports:
      - "${BACKEND_PORT}:5000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - refund_network


  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: refund_frontend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    ports:
      - "${FRONTEND_PORT}:3000"

    depends_on:
      - backend

    networks:
      - refund_network


volumes:
  postgres_data:


networks:
  refund_network:
    driver: bridge